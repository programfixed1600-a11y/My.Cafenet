name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug.keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Create google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "cafenet-smart",
              "storage_bucket": "cafenet-smart.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.cafenet.smart"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY_KEY_FOR_BUILD_ONLY_123456"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - - name: Build APK
  run: |
    ls -la
    gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: cafenet-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload unsigned release if present
        uses: actions/upload-artifact@v4
        with:
          name: cafenet-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
